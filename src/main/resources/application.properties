spring.application.name=geocyber-intel
server.port=${PORT:${SERVER_PORT:8080}}

# Logging Configuration
logging.level.org.geocyber=INFO
logging.level.org.springframework.security=WARN
logging.level.com.vaadin=INFO

# Database Configuration (H2 in PostgreSQL mode by default for zero-config run, override via ENV for PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:geocyberdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Vaadin Configuration (Dark theme, auto-launch disabled, production mode for standalone deployment)
vaadin.launch-browser=false
vaadin.productionMode=true

# Security & JWT Configuration
geocyber.security.jwt.secret=${JWT_SECRET:GeoCyberIntelSuperSecureResearchKeyLength256BitOrGreaterForGeopoliticalCyberAttributionPlatform2026}
geocyber.security.jwt.expiration-ms=86400000
geocyber.security.rate-limit.requests-per-minute=120

# Attribution AI Hyperparameters
geocyber.ai.transformer.embed-dim=64
geocyber.ai.transformer.num-heads=4
geocyber.ai.transformer.hidden-dim=128
geocyber.ai.transformer.dropout=0.1
geocyber.ai.transformer.learning-rate=0.005
geocyber.ai.calibration.temperature=1.25
geocyber.ai.unknown-threshold=0.35
